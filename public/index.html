<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>照片库总览 · OUTPUT</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header>
  <div class="hrow">
    <h1><span class="ico">📷</span>照片库总览</h1>
    <button class="root" id="rootPath" title="点击切换照片库目录">📂 选择目录…</button>
    <span class="lan" id="lanUrl" style="display:none" title="点击复制，手机/别的电脑用这个地址"></span>
    <div class="hright">
      <div class="hdr-actions">
        <div class="hdr-search" id="hdrSearch" style="display:none">
          <span class="ico" aria-hidden="true">🔍</span>
          <input type="text" id="q" placeholder="搜索日期 / 文件夹 / 相册名…" title="支持日期（如 2024-10、202410、10月29日）、文件夹名称、自定义相册名、相机型号，空格可组合多条件" autocomplete="off" spellcheck="false">
          <span class="cnt mono" id="hdrSearchCount">0</span>
          <button type="button" class="clr" id="btnClearQ" title="清空搜索（Esc）" aria-label="清空搜索">✕</button>
        </div>
        <button type="button" class="hdr-btn" id="btnCamOnly" style="display:none" aria-pressed="false" title="仅显示相机拍摄的文件夹（过滤手机照片与纯视频）">
          <span class="ico" aria-hidden="true">📷</span>
          <span>仅看相机</span>
          <span class="cnt mono" id="hdrCamCount">0</span>
        </button>
        <button type="button" class="hdr-fav" id="btnFavAlbum" style="display:none" title="查看所有已收藏的照片">
          <span class="star" aria-hidden="true">★</span>
          <span>收藏相册</span>
          <span class="cnt mono" id="hdrFavCount">0</span>
        </button>
      </div>
      <div class="stats">
        <div class="stat"><b class="mono" id="tFolders">–</b><span>文件夹</span></div>
        <div class="stat"><b class="mono" id="tFiles">–</b><span>文件</span></div>
        <div class="stat"><b class="mono" id="tSize">–</b><span>总大小</span></div>
        <div class="stat" title="上次扫描照片库耗时"><b class="mono" id="tTime">–</b><span>扫描耗时</span></div>
      </div>
    </div>
  </div>
  <div class="bar" id="progBar" style="display:none"><i style="width:0%"></i></div>
  <div class="scanning" id="scanLine" style="display:none"><span class="dot"></span><span id="scanText"></span></div>
</header>

<div class="toolbar">
  <div class="seg" id="sortSeg">
    <button data-sort="date" class="active">日期 ↓</button>
    <button data-sort="dateUp">日期 ↑</button>
    <button data-sort="size">大小 ↓</button>
    <button data-sort="files">张数 ↓</button>
  </div>
  <div class="seg" id="thumbSeg">
    <button data-t="off" class="active" title="不加载任何图片，最快">缩略图 关</button>
    <button data-t="auto" title="只加载屏幕上可见的缩略图">缩略图 自动</button>
  </div>
  <div class="seg" id="sizeSeg">
    <button data-s="s" title="小">小</button>
    <button data-s="m" title="中">中</button>
    <button data-s="l" class="active" title="大：总览变卡片墙">大</button>
    <button data-s="xl" title="特大">特大</button>
  </div>
  <button id="btnRescan" title="重新扫描磁盘">↻ 重新扫描</button>
  <button id="btnCache" title="查看 / 清空缩略图缓存">🧹 缓存</button>
  <span style="color:var(--fg3);font-size:12px" id="hintText"></span>
</div>

<main id="overview"></main>

<div id="detail">
  <div class="dhead">
    <div class="top">
      <button id="btnBack">← 返回总览</button>
      <h2 id="dTitle"></h2>
      <input type="text" id="dAlias" class="dalias" maxlength="80" placeholder="添加相册名称…" title="给相册起个自定义名称（不影响文件夹原名，回车或失焦自动保存）" autocomplete="off" spellcheck="false">
      <span style="margin-left:auto;display:flex;gap:8px">
        <button id="btnOpenFolder">📂 在资源管理器中打开</button>
      </span>
    </div>
    <div class="dmeta" id="dMeta"></div>
  </div>
  <div class="dbody">
    <div id="dSubs" class="subs"></div>
    <div class="toolbar" style="padding:0 0 12px;position:static;background:transparent">
      <div class="seg" id="filterSeg">
        <button data-f="all" class="active">全部</button>
        <button data-f="photo">照片</button>
        <button data-f="raw">RAW</button>
        <button data-f="video">视频</button>
        <button data-f="other">其它</button>
      </div>
      <div class="seg" id="thumbSeg2">
        <button data-t="off" class="active">缩略图 关</button>
        <button data-t="auto">缩略图 自动</button>
      </div>
      <div class="seg" id="sizeSeg2">
        <button data-s="s">小</button>
        <button data-s="m">中</button>
        <button data-s="l" class="active">大</button>
        <button data-s="xl">特大</button>
      </div>
      <span style="color:var(--fg3);font-size:12px" id="gridHint"></span>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div id="lb">
  <div class="stage" id="lbStage">
    <div class="stagebtns">
      <button type="button" id="lbFavBadge" class="stage-fav" title="收藏当前照片（快捷键 D）"><span class="star">☆</span> 收藏 [D]</button>
      <button id="lbFill" style="display:none" title="填充 = 裁切铺满（无黑边）／完整 = 保留整张图">填充</button>
      <button id="lbFull" title="图片全屏（Esc 退出）">⛶ 全屏</button>
    </div>
    <div class="canvas" id="lbCanvas"></div>
    <div class="lgspin" id="lbSpin"></div>
    <button class="nav prev" id="lbPrev">‹</button>
    <button class="nav next" id="lbNext">›</button>
  </div>
  <div class="side">
    <button class="lbclose" id="lbClose" style="position:static;float:right">✕</button>
    <h3 id="lbName"></h3>
    <div class="kv" id="lbInfo"></div>
    <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">
      <button id="lbOpen">📂 定位文件</button>
      <a id="lbDownload" download><button>⬇ 下载原图</button></a>
      <a id="lbDownloadRaw" download style="display:none"><button>⬇ 下载 RAW</button></a>
      <button id="lbForceFull" style="display:none" title="只这张看原图，不影响后面的浏览速度">🔍 本张看原图</button>
      <button id="lbDelete" class="btn-danger" style="display:none" title="移入系统废纸篓（可恢复）">🗑 删除</button>
    </div>
    <div class="seg" id="qualitySeg" style="margin-top:14px">
      <button data-q="preview">高清预览 2048</button>
      <button data-q="full">原图</button>
    </div>
    <div id="qualityNote" style="margin-top:6px;color:var(--fg3);font-size:11px"></div>
    <div id="peakWrap" style="margin-top:10px;display:none">
      <div class="seg peak-seg" id="peakSeg">
        <button id="btnFocusPeak" class="peak-main" style="flex:1" title="在画面上以绿色高亮标出最锐利的合焦边缘，直观判断对焦是否落在主体上（快捷键 P）">🎯 峰值对焦 [P]</button>
        <button id="btnPeakLevel" class="peak-lv" title="点击切换峰值敏感度：严格 / 标准 / 宽松">标准</button>
      </div>
    </div>
    <div id="rawDevWrap" style="margin-top:12px;display:none">
      <div class="raw-head" style="margin-top:0"><span>RAW 曝光提亮</span><span class="rv" id="rawEvVal">0 EV</span></div>
      <div class="raw-row">
        <div class="seg" id="rawDevSeg">
          <button data-ev="0" class="active">原图</button>
          <button data-ev="1">+1</button>
          <button data-ev="2">+2</button>
          <button data-ev="3">+3</button>
        </div>
        <div class="raw-step">
          <button id="btnEvMinus" title="降低 0.5 EV（最低 -4 EV）">−</button>
          <button id="btnEvPlus" title="提高 0.5 EV（最高 +4 EV）">+</button>
        </div>
      </div>
      <div class="raw-head"><span>RAW 暗部提亮</span><span class="rv" id="rawShVal">0%</span></div>
      <div class="raw-row">
        <div class="seg" id="rawShadowSeg">
          <button data-sh="0" class="active">关</button>
          <button data-sh="0.35">轻</button>
          <button data-sh="0.65">中</button>
          <button data-sh="1">强</button>
        </div>
        <div class="raw-step">
          <button id="btnShMinus" title="减少 10%（最低 0%）">−</button>
          <button id="btnShPlus" title="增加 10%（最高 200%，强之后可继续叠加）">+</button>
        </div>
      </div>
      <div class="raw-head"><span>RAW 曝光压暗</span><span class="rv" id="rawEvDarkVal">0 EV</span></div>
      <div class="raw-row">
        <div class="seg" id="rawDevDarkSeg">
          <button data-ev="-3">-3</button>
          <button data-ev="-2">-2</button>
          <button data-ev="-1">-1</button>
          <button data-ev="0" class="active">原图</button>
        </div>
        <div class="raw-step">
          <button id="btnEvDarkMinus" title="再降 0.5 EV（最低 -4 EV）">−</button>
          <button id="btnEvDarkPlus" title="提高 0.5 EV（最高 +4 EV）">+</button>
        </div>
      </div>
      <div class="raw-head"><span>RAW 高光压暗</span><span class="rv" id="rawHlVal">0%</span></div>
      <div class="raw-row">
        <div class="seg" id="rawHighlightSeg">
          <button data-hl="1">强</button>
          <button data-hl="0.65">中</button>
          <button data-hl="0.35">轻</button>
          <button data-hl="0" class="active">关</button>
        </div>
        <div class="raw-step">
          <button id="btnHlMinus" title="减少 10%（最低 0%）">−</button>
          <button id="btnHlPlus" title="增加 10%（最高 200%，强之后可继续叠加）">+</button>
        </div>
      </div>
      <div class="seg raw-clip-seg" id="rawClipSeg" style="margin-top:8px">
        <button id="btnRawClip" style="flex:1" title="基于 16-bit RAW 物理传感器标出：红=高光死白 · 正蓝=硬件死黑 · 浅蓝=跌进噪底，快捷键 G">溢出检查 [G]</button>
        <label class="raw-noise-box" id="rawNoiseBox" title="输入浅蓝噪底阈值（0~5%，支持小数如 0.05 / 0.1，0=关；回车或失焦生效，滚轮/上下键微调 0.05%）">
          <span>噪底</span>
          <input id="inpRawNoise" type="number" min="0" max="5" step="0.05" value="0.1" inputmode="decimal">
          <span>%</span>
        </label>
      </div>
      <button id="btnApplyLastRaw" style="display:none;width:100%;margin-top:6px;padding:5px 8px;font-size:12px;color:var(--accent);border-color:rgba(77,159,255,.4)" title="把上次调好的曝光/暗部/高光参数应用到当前这张照片"></button>
    </div>
    <div style="margin-top:18px;color:var(--fg3);font-size:11.5px;line-height:1.9">
      ← → 切图 ・ F 全屏 ・ D 收藏 ・ 退格 删除 ・ 空格 提亮 ・ G 溢出 ・ P 峰值<br>
      单击 放大/缩小 ・ 双击 关闭 ・ 滚轮/双指缩放<br>
      Esc 关闭　　后退键 返回网格
    </div>
  </div>
</div>

<div class="modal-mask" id="rootModal">
  <div class="modal">
    <div class="modal-h">
      <h3>📂 切换照片库目录</h3>
      <button id="btnRootClose" style="padding:4px 9px">✕</button>
    </div>
    <div id="rootLocalControls">
      <div class="modal-row">
        <button id="btnRootPick" class="btn-primary" style="width:100%">📂 打开系统文件夹选择器…</button>
      </div>
      <div class="modal-row">
        <input type="text" id="rootInput" placeholder="或直接粘贴路径，如 /Volumes/PhotoSSD/OUTPUT">
        <button id="btnRootApply">切换</button>
      </div>
    </div>
    <p class="modal-note" id="rootLanNote" style="display:none">局域网访问模式：可在下方常用目录间切换；如需添加新目录，请在主机电脑本机打开网页选择。</p>
    <p class="modal-err" id="rootErr"></p>
    <div id="rootRecentWrap" style="display:none">
      <div class="recent-title">最近使用的目录</div>
      <div class="recent-list" id="rootRecent"></div>
    </div>
  </div>
</div>

<div class="modal-mask" id="delModal">
  <div class="modal">
    <div class="modal-h">
      <h3 id="delTitle">🗑 移入废纸篓</h3>
      <button id="btnDelClose" style="padding:4px 9px">✕</button>
    </div>
    <p class="modal-note" id="delNote">文件会移入系统废纸篓，不会永久删除，可在废纸篓中恢复。</p>
    <div class="del-files" id="delFiles"></div>
    <p class="modal-err" id="delErr"></p>
    <div class="del-actions" id="delActions"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/js/app.js" defer></script>
<script src="/js/lightbox.js" defer></script>
<script src="/js/sharpness.js" defer></script>
<script src="/js/rawdev.js" defer></script>
<script src="/js/modals.js" defer></script>
</body>
</html>
